build-backend = "setuptools.build_meta"

[project]
name = "paper-codex-desktop-chat"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
packages = ["codex_desktop_chat", "codex_desktop_chat.tests"]
