[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-oled-formulas"
version = "1.0.0+review.2"
description = "Extract OLED display equations and preserve their page evidence"
requires-python = ">=3.11"
dependencies = ["codex-web-client==1.3.0+proprobe.1", "paper-core==1.0.0", "pymupdf==1.28.2", "Pillow>=10"]

[tool.setuptools]
packages = ["oled_formulas", "oled_formulas.tests"]
package-dir = {"oled_formulas" = "."}

[tool.setuptools.package-data]
oled_formulas = ["interface.json", "README.md", "audit-review-items.json", "unavailable-slot-authorization.json"]
